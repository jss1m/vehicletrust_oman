name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -v

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check repository readiness
        run: python scripts/check_repo_ready.py

      - name: Smoke test Gunicorn routes
        run: |
          gunicorn --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 60 wsgi:app &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /healthz /readyz /registry /verify /security-lab /lifecycle /audit /architecture; do
            curl --fail --silent --show-error "http://127.0.0.1:8000$route" > /dev/null
          done
