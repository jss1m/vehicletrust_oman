services:
  - type: web
    name: vehicletrust-oman-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DEMO_MODE
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_TOKEN
        generateValue: true
      - key: CHALLENGE_TTL_SECONDS
        value: "30"
