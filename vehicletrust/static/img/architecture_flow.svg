<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">VehicleTrust physical plate and vehicle identity architecture</title><desc id="desc">A static physical plate identity is resolved through entitlement, binding, status and history, then verified with a fresh vehicle challenge.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0875b8"/></marker></defs><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#fff" stroke="#172334" stroke-width="3"><rect x="25" y="50" width="180" height="90" rx="12"/><rect x="250" y="35" width="220" height="120" rx="12"/><rect x="515" y="35" width="220" height="120" rx="12"/><rect x="780" y="50" width="180" height="90" rx="12"/><rect x="780" y="230" width="180" height="90" rx="12"/><rect x="515" y="230" width="220" height="90" rx="12"/><rect x="250" y="230" width="220" height="90" rx="12"/><rect x="25" y="230" width="180" height="90" rx="12"/></g><g fill="#172334" font-size="17" font-weight="700"><text x="115" y="85">PHYSICAL PLATE</text><text x="115" y="110">Plate Number + UID</text><text x="360" y="70">SIGNED COSE CODE</text><text x="360" y="97">Static Plate UID</text><text x="360" y="124">Credential ID</text><text x="625" y="65">IDENTITY REGISTRY</text><text x="625" y="92">Entitlement · Binding</text><text x="625" y="119">Status · History</text><text x="870" y="85">EXPECTED</text><text x="870" y="110">VEHICLE</text><text x="870" y="265">FRESH CHALLENGE</text><text x="870" y="290">Nonce + Expiry</text><text x="625" y="265">VEHICLE SECURE</text><text x="625" y="290">MODULE PROOF</text><text x="360" y="265">IDENTITY</text><text x="360" y="290">ASSURANCE</text><text x="115" y="265">OPERATIONAL</text><text x="115" y="290">STATUS</text></g><g stroke="#0875b8" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M205 95h35"/><path d="M470 95h35"/><path d="M735 95h35"/><path d="M870 140v80"/><path d="M780 275h-35"/><path d="M515 275h-35"/><path d="M250 275h-35"/></g><g font-size="15" fill="#607084"><text x="550" y="390">STATIC PHYSICAL IDENTITY · DYNAMIC REGISTRY BINDING · LIVE CRYPTOGRAPHIC PROOF</text><text x="550" y="425">Cryptographic validity and operational authorization are evaluated separately.</text><text x="550" y="460">Research prototype · simulated registry and secure modules · complete audit history</text></g></g></svg>
